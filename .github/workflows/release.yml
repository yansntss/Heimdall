name: Release

on:
  push:
    tags: [ 'v*' ]

# Criar a release e anexar os arquivos precisa de escrita no repositório — em repos
# novos o token padrão é só leitura.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Antes de compilar qualquer coisa: a versão do csproj tem que bater com a tag (na
      # v1.1.0 o .exe saiu dizendo "1.0.0" na tela Sobre) e o CHANGELOG.md tem que ter a
      # seção da versão — falhar aqui evita esperar o build inteiro pra descobrir.
      - name: Validate version
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          [xml]$csproj = Get-Content Heimdall.csproj -Raw
          $props = $csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1
          $expected = @{ Version = $version; AssemblyVersion = "$version.0"; FileVersion = "$version.0" }
          $errors = @()
          foreach ($name in $expected.Keys) {
            if ($props.$name -ne $expected[$name]) { $errors += "Heimdall.csproj: <$name> é '$($props.$name)', esperado '$($expected[$name])'." }
          }
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          if ($changelog -notmatch ('(?m)^## \[' + [regex]::Escape($version) + '\]')) {
            $errors += "CHANGELOG.md sem a seção ## [$version]."
          }
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_ -ErrorAction Continue }
            exit 1
          }
          Write-Host "Versão $version conferida no csproj e no CHANGELOG.md."

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (framework-dependent)
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/light

      - name: Publish (self-contained)
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/standalone

      - name: Zip artifacts
        run: |
          Compress-Archive -Path publish/light/* -DestinationPath Heimdall-${{ github.ref_name }}-win-x64.zip
          Compress-Archive -Path publish/standalone/* -DestinationPath Heimdall-${{ github.ref_name }}-win-x64-standalone.zip

      - name: Generate checksums
        run: Get-FileHash *.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Out-File SHA256SUMS.txt

      # Corpo da release = RELEASE_TEMPLATE.md preenchido com a seção desta versão no
      # CHANGELOG.md e os checksums. Falha se a versão não estiver no CHANGELOG, pra
      # nunca sair uma release sem "O que mudou".
      - name: Build release notes
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)'
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success -or -not $match.Groups[1].Value.Trim()) {
            Write-Error "CHANGELOG.md sem a seção ## [$version] preenchida."
            exit 1
          }
          $template = Get-Content .github/RELEASE_TEMPLATE.md -Raw -Encoding utf8
          $body = [regex]::Replace($template, '(?s)^<!--.*?-->\s*', '')
          $body = $body.Replace('{{CHANGELOG}}', $match.Groups[1].Value.Trim())
          $body = $body.Replace('{{SHA256SUMS}}', (Get-Content SHA256SUMS.txt -Raw).Trim())
          $body = $body.Replace('vX.Y.Z', $tag)
          Set-Content release-notes.md $body -Encoding utf8

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            SHA256SUMS.txt
          body_path: release-notes.md
          generate_release_notes: true
