name: Build

# Só compila, a cada push/PR na master — pra saber se a master está pronta pra virar
# release antes de criar a tag (a release em si é o release.yml, disparado por tag v*).
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release
